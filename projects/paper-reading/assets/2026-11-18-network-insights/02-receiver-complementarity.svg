<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="805" viewBox="0 0 1400 805" role="img" aria-labelledby="title desc">
<title id="title">辅助接收点是否收到了中心漏掉的包</title><desc id="desc">两个接收点均收到十包中的九包。当它们均漏第四包时，联合仍只得到九包；中心漏第四包而辅助漏第七包时，联合可得到全部十包，随后还需转发第四包给中心。</desc>
<rect width="100%" height="100%" fill="white"/>
