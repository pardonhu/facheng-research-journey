<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="815" viewBox="0 0 1400 815" role="img" aria-labelledby="title desc">
<title id="title">把连续丢包分到不同编码组</title><desc id="desc">同一叶节点的九条数据分为三组，每组三条数据和一条校验。前面连续三个发送位置丢失时，按组发送使A组缺三包；交织发送使每组各缺一包，可分别恢复。</desc>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="64" y="65" font-size="40" fill="#172b4d" font-weight="700" text-anchor="start">连续漏掉 3 个包，怎样让它们仍可恢复？</text>
<text x="64" y="110" font-size="26" fill="#50647a" font-weight="400" text-anchor="start">同一叶节点的 9 条数据分为 A、B、C 三组，每组增加 1 个 XOR 校验包。</text>
<text x="64" y="151" font-size="24" fill="#50647a" font-weight="400" text-anchor="start">示意假设：前 3 个发送位置丢包；每组可恢复 1 个已知位置的丢包。</text>
<rect x="48" y="188" width="1304" height="232" rx="12" fill="white" stroke="#d9e2ec" stroke-width="1.5"/>
<text x="68" y="230" font-size="28" fill="#172b4d" font-weight="700" text-anchor="start">按组发：连续丢失集中到 A 组</text>
<text x="114" y="263" font-size="20" fill="#50647a" font-weight="400" text-anchor="middle">1</text>
<rect x="68" y="276" width="92" height="73" rx="8" fill="#fff0f0" stroke="#c3393d" stroke-width="2.5"/>
<text x="114" y="307" font-size="25" fill="#2463b4" font-weight="700" text-anchor="middle">A1</text>
<text x="114" y="334" font-size="19" fill="#c3393d" font-weight="400" text-anchor="middle">× 丢失</text>
<text x="217" y="263" font-size="20" fill="#50647a" font-weight="400" text-anchor="middle">2</text>
<rect x="171" y="276" width="92" height="73" rx="8" fill="#fff0f0" stroke="#c3393d" stroke-width="2.5"/>
<text x="217" y="307" font-size="25" fill="#2463b4" font-weight="700" text-anchor="middle">A2</text>
<text x="217" y="334" font-size="19" fill="#c3393d" font-weight="400" text-anchor="middle">× 丢失</text>
<text x="320" y="263" font-size="20" fill="#50647a" font-weight="400" text-anchor="middle">3</text>
<rect x="274" y="276" width="92" height="73" rx="8" fill="#fff0f0" stroke="#c3393d" stroke-width="2.5"/>
<text x="320" y="307" font-size="25" fill="#2463b4" font-weight="700" text-anchor="middle">A3</text>
<text x="320" y="334" font-size="19" fill="#c3393d" font-weight="400" text-anchor="middle">× 丢失</text>
<text x="423" y="263" font-size="20" fill="#50647a" font-weight="400" text-anchor="middle">4</text>
<rect x="377" y="276" width="92" height="73" rx="8" fill="#eaf1fc" stroke="#2463b4" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="423" y="307" font-size="25" fill="#2463b4" font-weight="700" text-anchor="middle">AP</text>
<text x="423" y="334" font-size="19" fill="#50647a" font-weight="400" text-anchor="middle">校验</text>
<text x="526" y="263" font-size="20" fill="#50647a" font-weight="400" text-anchor="middle">5</text>
<rect x="480" y="276" width="92" height="73" rx="8" fill="#e9f6f4" stroke="#117c75" stroke-width="1.5"/>
<text x="526" y="307" font-size="25" fill="#117c75" font-weight="700" text-anchor="middle">B1</text>
<text x="526" y="334" font-size="19" fill="#50647a" font-weight="400" text-anchor="middle">收到</text>
<text x="629" y="263" font-size="20" fill="#50647a" font-weight="400" text-anchor="middle">6</text>
<rect x="583" y="276" width="92" height="73" rx="8" fill="#e9f6f4" stroke="#117c75" stroke-width="1.5"/>
<text x="629" y="307" font-size="25" fill="#117c75" font-weight="700" text-anchor="middle">B2</text>
<text x="629" y="334" font-size="19" fill="#50647a" font-weight="400" text-anchor="middle">收到</text>
<text x="732" y="263" font-size="20" fill="#50647a" font-weight="400" text-anchor="middle">7</text>
<rect x="686" y="276" width="92" height="73" rx="8" fill="#e9f6f4" stroke="#117c75" stroke-width="1.5"/>
<text x="732" y="307" font-size="25" fill="#117c75" font-weight="700" text-anchor="middle">B3</text>
<text x="732" y="334" font-size="19" fill="#50647a" font-weight="400" text-anchor="middle">收到</text>
<text x="835" y="263" font-size="20" fill="#50647a" font-weight="400" text-anchor="middle">8</text>
<rect x="789" y="276" width="92" height="73" rx="8" fill="#e9f6f4" stroke="#117c75" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="835" y="307" font-size="25" fill="#117c75" font-weight="700" text-anchor="middle">BP</text>
<text x="835" y="334" font-size="19" fill="#50647a" font-weight="400" text-anchor="middle">校验</text>
<text x="938" y="263" font-size="20" fill="#50647a" font-weight="400" text-anchor="middle">9</text>
<rect x="892" y="276" width="92" height="73" rx="8" fill="#fff4e4" stroke="#b56815" stroke-width="1.5"/>
<text x="938" y="307" font-size="25" fill="#b56815" font-weight="700" text-anchor="middle">C1</text>
<text x="938" y="334" font-size="19" fill="#50647a" font-weight="400" text-anchor="middle">收到</text>
<text x="1041" y="263" font-size="20" fill="#50647a" font-weight="400" text-anchor="middle">10</text>
<rect x="995" y="276" width="92" height="73" rx="8" fill="#fff4e4" stroke="#b56815" stroke-width="1.5"/>
<text x="1041" y="307" font-size="25" fill="#b56815" font-weight="700" text-anchor="middle">C2</text>
<text x="1041" y="334" font-size="19" fill="#50647a" font-weight="400" text-anchor="middle">收到</text>
<text x="1144" y="263" font-size="20" fill="#50647a" font-weight="400" text-anchor="middle">11</text>
<rect x="1098" y="276" width="92" height="73" rx="8" fill="#fff4e4" stroke="#b56815" stroke-width="1.5"/>
<text x="1144" y="307" font-size="25" fill="#b56815" font-weight="700" text-anchor="middle">C3</text>
<text x="1144" y="334" font-size="19" fill="#50647a" font-weight="400" text-anchor="middle">收到</text>
<text x="1247" y="263" font-size="20" fill="#50647a" font-weight="400" text-anchor="middle">12</text>
<rect x="1201" y="276" width="92" height="73" rx="8" fill="#fff4e4" stroke="#b56815" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1247" y="307" font-size="25" fill="#b56815" font-weight="700" text-anchor="middle">CP</text>
<text x="1247" y="334" font-size="19" fill="#50647a" font-weight="400" text-anchor="middle">校验</text>
<text x="74" y="394" font-size="24" fill="#c3393d" font-weight="600" text-anchor="start">A 组缺 3 包：恢复不了</text>
<text x="513" y="394" font-size="24" fill="#117c75" font-weight="600" text-anchor="start">B 组完整</text>
<text x="947" y="394" font-size="24" fill="#b56815" font-weight="600" text-anchor="start">C 组完整</text>
<rect x="48" y="444" width="1304" height="232" rx="12" fill="white" stroke="#d9e2ec" stroke-width="1.5"/>
<text x="68" y="486" font-size="28" fill="#172b4d" font-weight="700" text-anchor="start">交错发：同样的连续丢失分散到三组</text>
<text x="114" y="519" font-size="20" fill="#50647a" font-weight="400" text-anchor="middle">1</text>
<rect x="68" y="532" width="92" height="73" rx="8" fill="#fff0f0" stroke="#c3393d" stroke-width="2.5"/>
<text x="114" y="563" font-size="25" fill="#2463b4" font-weight="700" text-anchor="middle">A1</text>
<text x="114" y="590" font-size="19" fill="#c3393d" font-weight="400" text-anchor="middle">× 丢失</text>
<text x="217" y="519" font-size="20" fill="#50647a" font-weight="400" text-anchor="middle">2</text>
<rect x="171" y="532" width="92" height="73" rx="8" fill="#fff0f0" stroke="#c3393d" stroke-width="2.5"/>
<text x="217" y="563" font-size="25" fill="#117c75" font-weight="700" text-anchor="middle">B1</text>
<text x="217" y="590" font-size="19" fill="#c3393d" font-weight="400" text-anchor="middle">× 丢失</text>
<text x="320" y="519" font-size="20" fill="#50647a" font-weight="400" text-anchor="middle">3</text>
<rect x="274" y="532" width="92" height="73" rx="8" fill="#fff0f0" stroke="#c3393d" stroke-width="2.5"/>
<text x="320" y="563" font-size="25" fill="#b56815" font-weight="700" text-anchor="middle">C1</text>
<text x="320" y="590" font-size="19" fill="#c3393d" font-weight="400" text-anchor="middle">× 丢失</text>
<text x="423" y="519" font-size="20" fill="#50647a" font-weight="400" text-anchor="middle">4</text>
<rect x="377" y="532" width="92" height="73" rx="8" fill="#eaf1fc" stroke="#2463b4" stroke-width="1.5"/>
<text x="423" y="563" font-size="25" fill="#2463b4" font-weight="700" text-anchor="middle">A2</text>
<text x="423" y="590" font-size="19" fill="#50647a" font-weight="400" text-anchor="middle">收到</text>
<text x="526" y="519" font-size="20" fill="#50647a" font-weight="400" text-anchor="middle">5</text>
<rect x="480" y="532" width="92" height="73" rx="8" fill="#e9f6f4" stroke="#117c75" stroke-width="1.5"/>
<text x="526" y="563" font-size="25" fill="#117c75" font-weight="700" text-anchor="middle">B2</text>
<text x="526" y="590" font-size="19" fill="#50647a" font-weight="400" text-anchor="middle">收到</text>
<text x="629" y="519" font-size="20" fill="#50647a" font-weight="400" text-anchor="middle">6</text>
<rect x="583" y="532" width="92" height="73" rx="8" fill="#fff4e4" stroke="#b56815" stroke-width="1.5"/>
<text x="629" y="563" font-size="25" fill="#b56815" font-weight="700" text-anchor="middle">C2</text>
<text x="629" y="590" font-size="19" fill="#50647a" font-weight="400" text-anchor="middle">收到</text>
<text x="732" y="519" font-size="20" fill="#50647a" font-weight="400" text-anchor="middle">7</text>
<rect x="686" y="532" width="92" height="73" rx="8" fill="#eaf1fc" stroke="#2463b4" stroke-width="1.5"/>
<text x="732" y="563" font-size="25" fill="#2463b4" font-weight="700" text-anchor="middle">A3</text>
<text x="732" y="590" font-size="19" fill="#50647a" font-weight="400" text-anchor="middle">收到</text>
<text x="835" y="519" font-size="20" fill="#50647a" font-weight="400" text-anchor="middle">8</text>
<rect x="789" y="532" width="92" height="73" rx="8" fill="#e9f6f4" stroke="#117c75" stroke-width="1.5"/>
<text x="835" y="563" font-size="25" fill="#117c75" font-weight="700" text-anchor="middle">B3</text>
<text x="835" y="590" font-size="19" fill="#50647a" font-weight="400" text-anchor="middle">收到</text>
<text x="938" y="519" font-size="20" fill="#50647a" font-weight="400" text-anchor="middle">9</text>
<rect x="892" y="532" width="92" height="73" rx="8" fill="#fff4e4" stroke="#b56815" stroke-width="1.5"/>
<text x="938" y="563" font-size="25" fill="#b56815" font-weight="700" text-anchor="middle">C3</text>
<text x="938" y="590" font-size="19" fill="#50647a" font-weight="400" text-anchor="middle">收到</text>
<text x="1041" y="519" font-size="20" fill="#50647a" font-weight="400" text-anchor="middle">10</text>
<rect x="995" y="532" width="92" height="73" rx="8" fill="#eaf1fc" stroke="#2463b4" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1041" y="563" font-size="25" fill="#2463b4" font-weight="700" text-anchor="middle">AP</text>
<text x="1041" y="590" font-size="19" fill="#50647a" font-weight="400" text-anchor="middle">校验</text>
<text x="1144" y="519" font-size="20" fill="#50647a" font-weight="400" text-anchor="middle">11</text>
<rect x="1098" y="532" width="92" height="73" rx="8" fill="#e9f6f4" stroke="#117c75" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1144" y="563" font-size="25" fill="#117c75" font-weight="700" text-anchor="middle">BP</text>
<text x="1144" y="590" font-size="19" fill="#50647a" font-weight="400" text-anchor="middle">校验</text>
<text x="1247" y="519" font-size="20" fill="#50647a" font-weight="400" text-anchor="middle">12</text>
<rect x="1201" y="532" width="92" height="73" rx="8" fill="#fff4e4" stroke="#b56815" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1247" y="563" font-size="25" fill="#b56815" font-weight="700" text-anchor="middle">CP</text>
<text x="1247" y="590" font-size="19" fill="#50647a" font-weight="400" text-anchor="middle">校验</text>
<text x="74" y="650" font-size="24" fill="#2463b4" font-weight="600" text-anchor="start">A 组缺 1 包：可恢复</text>
<text x="513" y="650" font-size="24" fill="#117c75" font-weight="600" text-anchor="start">B 组缺 1 包：可恢复</text>
<text x="947" y="650" font-size="24" fill="#b56815" font-weight="600" text-anchor="start">C 组缺 1 包：可恢复</text>
<text x="64" y="721" font-size="25" fill="#172b4d" font-weight="600" text-anchor="start">改变的是发送次序；两种次序都发 9 个数据包 + 3 个校验包。</text>
<text x="64" y="764" font-size="23" fill="#50647a" font-weight="400" text-anchor="start">A / B / C 是同一叶节点的编码组。示意例子，非实测结果；XOR 用来说明原理。</text>
</g>
</svg>