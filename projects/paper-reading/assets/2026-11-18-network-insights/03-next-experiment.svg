<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990" role="img" aria-labelledby="title desc">
<title id="title">下一轮测试哪一组参数</title><desc id="desc">PS-BAX思路的示意：根据历史测试对未知表现做一次模型抽样，预测A C D合格；从候选中选未知程度最高的D做真实测试，再把结果加入历史。E虽然未知程度很高，本轮抽样预测不合格；下轮重新抽样。</desc>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="64" y="64" font-size="37" fill="#172b4d" font-weight="700" text-anchor="start">下一次测哪组参数？先选有希望又没测清的组合</text>
<text x="64" y="110" font-size="25" fill="#50647a" font-weight="400" text-anchor="start">PS-BAX 选择思路的组网示意：模型每轮给出一种可能情况，真实测试负责验证。</text>
<rect x="64" y="140" width="1272" height="70" rx="12" fill="#f6f8fb" stroke="#f6f8fb" stroke-width="1.5"/>
<text x="88" y="183" font-size="26" fill="#172b4d" font-weight="400" text-anchor="start">输入：已测参数 + 整轮用时 + 完整收齐比例；预先设定合格要求。</text>
<rect x="64" y="245" width="240" height="310" rx="12" fill="white" stroke="#d9e2ec" stroke-width="1.5"/>
<text x="86" y="288" font-size="29" fill="#172b4d" font-weight="700" text-anchor="start">组合 A</text>
<text x="86" y="329" font-size="23" fill="#50647a" font-weight="400" text-anchor="start">已有较充分数据</text>
<line x1="84" y1="348" x2="284" y2="348" stroke="#d9e2ec" stroke-width="2"/>
<text x="86" y="386" font-size="23" fill="#50647a" font-weight="400" text-anchor="start">本轮抽样预测</text>
<text x="86" y="429" font-size="29" fill="#117c75" font-weight="700" text-anchor="start">合格</text>
<text x="86" y="476" font-size="23" fill="#172b4d" font-weight="400" text-anchor="start">未知程度：低</text>
<text x="86" y="525" font-size="22" fill="#117c75" font-weight="400" text-anchor="start">进入本轮候选</text>
<rect x="322" y="245" width="240" height="310" rx="12" fill="white" stroke="#d9e2ec" stroke-width="1.5"/>
<text x="344" y="288" font-size="29" fill="#172b4d" font-weight="700" text-anchor="start">组合 B</text>
<text x="344" y="329" font-size="23" fill="#50647a" font-weight="400" text-anchor="start">已有较充分数据</text>
<line x1="342" y1="348" x2="542" y2="348" stroke="#d9e2ec" stroke-width="2"/>
<text x="344" y="386" font-size="23" fill="#50647a" font-weight="400" text-anchor="start">本轮抽样预测</text>
<text x="344" y="429" font-size="29" fill="#50647a" font-weight="700" text-anchor="start">不合格</text>
<text x="344" y="476" font-size="23" fill="#172b4d" font-weight="400" text-anchor="start">未知程度：低</text>
<text x="344" y="525" font-size="22" fill="#50647a" font-weight="400" text-anchor="start">本轮未入候选</text>
<rect x="580" y="245" width="240" height="310" rx="12" fill="white" stroke="#d9e2ec" stroke-width="1.5"/>
<text x="602" y="288" font-size="29" fill="#172b4d" font-weight="700" text-anchor="start">组合 C</text>
<text x="602" y="329" font-size="23" fill="#50647a" font-weight="400" text-anchor="start">数据较少</text>
<line x1="600" y1="348" x2="800" y2="348" stroke="#d9e2ec" stroke-width="2"/>
<text x="602" y="386" font-size="23" fill="#50647a" font-weight="400" text-anchor="start">本轮抽样预测</text>
<text x="602" y="429" font-size="29" fill="#117c75" font-weight="700" text-anchor="start">合格</text>
<text x="602" y="476" font-size="23" fill="#172b4d" font-weight="400" text-anchor="start">未知程度：中</text>
<text x="602" y="525" font-size="22" fill="#117c75" font-weight="400" text-anchor="start">进入本轮候选</text>
<rect x="838" y="245" width="240" height="310" rx="12" fill="#fff6e9" stroke="#b56815" stroke-width="3"/>
<text x="860" y="288" font-size="29" fill="#172b4d" font-weight="700" text-anchor="start">组合 D</text>
<text x="860" y="329" font-size="23" fill="#50647a" font-weight="400" text-anchor="start">数据较少</text>
<line x1="858" y1="348" x2="1058" y2="348" stroke="#d9e2ec" stroke-width="2"/>
<text x="860" y="386" font-size="23" fill="#50647a" font-weight="400" text-anchor="start">本轮抽样预测</text>
<text x="860" y="429" font-size="29" fill="#117c75" font-weight="700" text-anchor="start">合格</text>
<text x="860" y="476" font-size="23" fill="#172b4d" font-weight="400" text-anchor="start">未知程度：高</text>
<rect x="854" y="497" width="208" height="40" rx="7" fill="#b56815" stroke="#b56815" stroke-width="1.5"/>
<text x="958" y="525" font-size="23" fill="white" font-weight="600" text-anchor="middle">本轮测试 D</text>
<rect x="1096" y="245" width="240" height="310" rx="12" fill="white" stroke="#d9e2ec" stroke-width="1.5"/>
<text x="1118" y="288" font-size="29" fill="#172b4d" font-weight="700" text-anchor="start">组合 E</text>
<text x="1118" y="329" font-size="23" fill="#50647a" font-weight="400" text-anchor="start">数据很少</text>
<line x1="1116" y1="348" x2="1316" y2="348" stroke="#d9e2ec" stroke-width="2"/>
<text x="1118" y="386" font-size="23" fill="#50647a" font-weight="400" text-anchor="start">本轮抽样预测</text>
<text x="1118" y="429" font-size="29" fill="#50647a" font-weight="700" text-anchor="start">不合格</text>
<text x="1118" y="476" font-size="23" fill="#172b4d" font-weight="400" text-anchor="start">未知程度：很高</text>
<text x="1118" y="525" font-size="22" fill="#50647a" font-weight="400" text-anchor="start">本轮未入候选</text>
<text x="64" y="600" font-size="28" fill="#2463b4" font-weight="600" text-anchor="start">本轮候选是 A、C、D；D 的未知程度最高，所以先测 D。</text>
<rect x="64" y="642" width="288" height="112" rx="12" fill="#f6f8fb" stroke="#d9e2ec" stroke-width="1.5"/>
<text x="208" y="684" font-size="25" fill="#172b4d" font-weight="600" text-anchor="middle">历史测试记录</text>
<text x="208" y="725" font-size="21" fill="#50647a" font-weight="400" text-anchor="middle">告诉模型已知结果</text>
<line x1="357" y1="698" x2="383" y2="698" stroke="#50647a" stroke-width="2"/>
<polygon points="383,698 373.0,703.0 373.0,693.0" fill="#50647a"/>
<rect x="392" y="642" width="288" height="112" rx="12" fill="#f6f8fb" stroke="#d9e2ec" stroke-width="1.5"/>
<text x="536" y="684" font-size="25" fill="#172b4d" font-weight="600" text-anchor="middle">抽样并选候选</text>
<text x="536" y="725" font-size="21" fill="#50647a" font-weight="400" text-anchor="middle">本轮选中 D</text>
<line x1="685" y1="698" x2="711" y2="698" stroke="#50647a" stroke-width="2"/>
<polygon points="711,698 701.0,703.0 701.0,693.0" fill="#50647a"/>
<rect x="720" y="642" width="288" height="112" rx="12" fill="#f6f8fb" stroke="#d9e2ec" stroke-width="1.5"/>
<text x="864" y="684" font-size="25" fill="#172b4d" font-weight="600" text-anchor="middle">做真实组网测试</text>
<text x="864" y="725" font-size="21" fill="#50647a" font-weight="400" text-anchor="middle">测用时和完整收齐比例</text>
<line x1="1013" y1="698" x2="1039" y2="698" stroke="#50647a" stroke-width="2"/>
<polygon points="1039,698 1029.0,703.0 1029.0,693.0" fill="#50647a"/>
<rect x="1048" y="642" width="288" height="112" rx="12" fill="#f6f8fb" stroke="#d9e2ec" stroke-width="1.5"/>
<text x="1192" y="684" font-size="25" fill="#172b4d" font-weight="600" text-anchor="middle">加入新结果</text>
<text x="1192" y="725" font-size="21" fill="#50647a" font-weight="400" text-anchor="middle">下一轮重新选择</text>
<line x1="1192" y1="765" x2="1192" y2="797" stroke="#50647a" stroke-width="2"/>
<line x1="1192" y1="797" x2="208" y2="797" stroke="#50647a" stroke-width="2"/>
<line x1="208" y1="797" x2="208" y2="765" stroke="#50647a" stroke-width="2"/>
<polygon points="208,765 213.0,775.0 203.0,775.0" fill="#50647a"/>
<text x="64" y="852" font-size="24" fill="#50647a" font-weight="400" text-anchor="start">E 这次未入选，下一轮仍会重新抽样。图中的预测与未知程度均为示意。</text>
<text x="64" y="898" font-size="24" fill="#172b4d" font-weight="400" text-anchor="start">组合指前导码、帧间隔、功率等参数的一个搭配；模型放在电脑上选择下一次测试。</text>
<text x="64" y="944" font-size="23" fill="#50647a" font-weight="400" text-anchor="start">论文用于黑箱算法任务；在组网中使用时，还需定义多项要求和重复测试方式。</text>
</g>
</svg>